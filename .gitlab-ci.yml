# GitLab CI/CD — odpowiednik .github/workflows/ci.yml + security.yml.
# Pipeline odpala sie na merge requestach i pushach do `main`.

stages:
  - validate
  - test
  - build
  - e2e
  - security

variables:
  NODE_VERSION: "22"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: secret
  POSTGRES_DB: social_db
  # Wewnatrz joba `pg-tests` Postgres jest dostepny pod hostem `postgres`.
  DATABASE_URL: "postgresql://postgres:secret@postgres:5432/social_db?schema=public"
  # Dla docker-in-docker
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# ----------------------------------------------------------------------------
# Wspolny szablon dla jobow Node — cache npm per serwis.
# ----------------------------------------------------------------------------
.node-base:
  image: node:22-alpine
  before_script:
    - apk add --no-cache bash curl
  cache:
    key:
      files:
        - "$SERVICE_DIR/package-lock.json"
    paths:
      - "$SERVICE_DIR/node_modules/"

# ============================================================================
# 2. TEST — typecheck + unit + integration na realnym Postgresie.
# ============================================================================
pg-tests:
  stage: test
  extends: .node-base
  variables:
    SERVICE_DIR: apps/backend/pg-service
    NODE_ENV: test
  services:
    - name: postgres:15-alpine
      alias: postgres
  script:
    - cd apps/backend/pg-service
    - npm ci
    - npx prisma generate
    - echo "Czekam na Postgres..."
    - apk add --no-cache postgresql-client
    - for i in $(seq 1 30); do pg_isready -h postgres -U postgres -d social_db && break || sleep 2; done
    - npm run build                                         # typecheck (noEmit:true)
    - npx prisma migrate deploy
    - npx knex migrate:latest --knexfile knexfile.cjs
    - npm test -- --ci                                       # unit (z mockami)
    - npm run test:integration -- --ci                       # integration (realna DB)
  rules:
    - changes:
        - apps/backend/pg-service/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

mongo-tests:
  stage: test
  extends: .node-base
  variables:
    SERVICE_DIR: apps/backend/mongo-service
  script:
    - cd apps/backend/mongo-service
    - npm ci
    - npm run build      # typecheck + emit
    - npm test           # node:test z mockami mongoose
  rules:
    - changes:
        - apps/backend/mongo-service/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# 3. BUILD — walidacja Dockerfile'i obu serwisow.
# ============================================================================
.docker-build-base:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker info
  rules:
    - changes:
        - apps/backend/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docker-build:pg:
  extends: .docker-build-base
  script:
    - docker build -t pg-service:ci apps/backend/pg-service

docker-build:mongo:
  extends: .docker-build-base
  script:
    - docker build -t mongo-service:ci apps/backend/mongo-service

# ============================================================================
# 5. SECURITY — npm audit + gitleaks.
# ============================================================================
.audit-base:
  stage: security
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

npm-audit:pg:
  extends: .audit-base
  script:
    - cd apps/backend/pg-service
    - npm ci --omit=dev
    - npm audit --omit=dev --audit-level=high
  allow_failure: true   # raportuj, ale nie blokuj MR

npm-audit:mongo:
  extends: .audit-base
  script:
    - cd apps/backend/mongo-service
    - npm ci --omit=dev
    - npm audit --omit=dev --audit-level=high
  allow_failure: true

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --no-banner --redact -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================================
# 6. Bramka — sztuczny job zalezny od reszty (do ustawienia jako required
#    w Merge request settings → Pipelines must succeed).
# ============================================================================
ci-passed:
  stage: security
  image: alpine:3.20
  needs:
    - job: pg-tests
      optional: true
    - job: mongo-tests
      optional: true
    - job: docker-build:pg
      optional: true
    - job: docker-build:mongo
      optional: true
  script:
    - echo "Wszystkie wymagane joby przeszly."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
