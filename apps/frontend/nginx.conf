# Serwuje zbudowany SPA. Fallback na /index.html zapewnia dzialanie OAuth2 redirectu
# (Keycloak wraca na origin '/', a router klienta obsluguje reszte po stronie przegladarki).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
