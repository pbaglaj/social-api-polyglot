services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongodata:/data/db
    networks:
      - internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Authorization Server (OAuth2 / OIDC) ---
  # Dedykowana baza Postgres tylko dla Keycloaka (oddzielona od bazy aplikacji).
  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME}
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d ${KC_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Keycloak = Authorization Server. Realm SocialPolyglot importowany przy starcie
  # z keycloak/realm-export.json (role Admin/User/Moderator/analytics + 3 klienci OAuth2).
  # Wystawiony na hosta (port 8090) dla przegladarki; w sieci internal dostepny jako keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
      # Podstawiane w realm-export.json (IdP google) przy imporcie realmu.
      # Bez tego placeholdery ${GOOGLE_CLIENT_ID}/${GOOGLE_CLIENT_SECRET} zostaja doslowne.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    networks:
      - edge
      - internal
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # KC_HEALTH_ENABLED=true wystawia /health/* na porcie ZARZADZANIA 9000
      # (nie na 8080 - tam jest 404). Obraz keycloaka nie ma curl/wget, wiec
      # uzywamy bashowego /dev/tcp (bash jest w obrazie). /health/ready zwraca
      # 200 dopiero gdy DB/realm gotowe (w trakcie startu 503), wiec to wlasciwy
      # sygnal "gotowy do ruchu" - lepszy niz sam fakt, ze kontener wstal.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Zimny start (po down -v keycloak-db robi pelny liquibase schema-init)
      # trwa ~4 min do "started"; duze start_period, by nie wpasc w unhealthy
      # zanim Quarkus wystartuje. Pierwszy sukces => natychmiast healthy.
      start_period: 200s
    # Bez limitu CPU: augmentacja Quarkusa w `start-dev` jest CPU-bound i mocno
    # zrownoleglona - cap dlawil zimny start (~4 min). Bez capu uzywa wszystkich
    # rdzeni hosta. Calkowicie augmentacje eliminuje wariant 'optimized'
    # (docker-compose.optimized.yml) - patrz keycloak/Dockerfile.
    mem_limit: 1024m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pg-service:
    image: project-p-baglaj/pg-service:${APP_VERSION:-dev}
    build:
      context: ./pg-service
      dockerfile: Dockerfile
    environment:
      # Domyslnie puste (=produkcyjne wymuszanie auth). CI E2E ustawia NODE_ENV=test,
      # by requireAuth/requireRole staly sie pass-through (kolekcja Postman bez tokenow).
      NODE_ENV: ${NODE_ENV:-}
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PG_SERVICE_PORT}
      REDIS_URL: ${REDIS_URL}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      # OAuth2 / walidacja JWT (Keycloak)
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      # Keycloak Admin REST API (zarzadzanie userami przez backend)
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
    networks:
      # internal: ruch serwis<->serwis (DB, keycloak). edge: wyjscie na zewnatrz (NAT) -
      # potrzebne dla Fazy 4: pg-service wola Google Calendar API (siec 'internal' ma
      # internal:true, czyli brak egressu do internetu).
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const port=process.env.PORT||process.env.PG_SERVICE_PORT||3001; const req=http.get({host:'127.0.0.1', port: port, path:'/health', timeout:2000}, res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 5s
      timeout: 5s
      retries: 5
      # Zimny start po `down -v` robi pelny migrate+seed (Prisma+Knex) i serwer
      # zaczyna nasluchiwac na /health dopiero po ~40-50s. Bez start_period te
      # wczesne, nieudane proby liczyly sie jako retries i kontener wpadal w
      # 'unhealthy' (~25s) ZANIM wstal -> api-gateway/frontend/ssr-client nie
      # startowaly. W oknie start_period porazki nie sa liczone, a pierwszy sukces
      # natychmiast oznacza kontener jako healthy (cieple restarty bez kary).
      start_period: 90s
    # T9: Migracje (Prisma + Knex) i seedy z compose, odpalane przed startem aplikacji.
    # Kolejność: 1) Prisma migrate deploy, 2) Knex migrate latest, 3) Prisma seed, 4) Knex seed, 5) Start serwera.
    command: >
      sh -c "npx prisma migrate deploy
      && npx knex migrate:latest --knexfile knexfile.cjs
      && npx prisma db seed
      && npx knex seed:run --knexfile knexfile.cjs
      && npx tsx src/index.ts"
    cpus: 1.0
    mem_limit: 768m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo-service:
    image: project-p-baglaj/mongo-service:${APP_VERSION:-dev}
    build:
      context: ./mongo-service
      dockerfile: Dockerfile
    environment:
      # Patrz pg-service: NODE_ENV=test w CI wylacza wymuszanie auth dla E2E.
      NODE_ENV: ${NODE_ENV:-}
      MONGO_URI: ${MONGO_URI}
      PORT: ${MONGO_SERVICE_PORT}
      # OAuth2 / walidacja JWT (Keycloak)
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
    # Seed feedu/rich-postow (paginacja kursorem) odpalany przed startem serwera.
    command: >
      sh -c "node dist/seed.js
      && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const port=process.env.PORT||process.env.MONGO_SERVICE_PORT||3002; const req=http.get({host:'127.0.0.1', port: port, path:'/health', timeout:2000}, res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 5s
      timeout: 5s
      retries: 5
      # Seed feedu odpalany przed startem serwera - daj zapas zanim /health wstanie.
      start_period: 45s
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: nginx:alpine
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_GATEWAY_PORT}:80"
    networks:
      - edge
      - internal
    depends_on:
      pg-service:
        condition: service_healthy
      mongo-service:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Client nr 1: SPA (React + Vite + PKCE) ---
  # Statyczny bundle serwowany przez nginx. Przegladarka laduje go z :5173, a stamtad
  # rozmawia z gatewayem (:8080) i Keycloakiem (:8090) po stronie hosta.
  frontend:
    image: project-p-baglaj/frontend:${APP_VERSION:-dev}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080/api}
        VITE_KEYCLOAK_AUTHORITY: ${VITE_KEYCLOAK_AUTHORITY:-http://localhost:8090/realms/SocialPolyglot}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-spa-client}
    ports:
      - "5173:80"
    networks:
      - edge
    depends_on:
      - api-gateway
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Client nr 2: SSR (Express + EJS, Authorization Code confidential) ---
  # Na edge (port 4000 + redirecty przegladarki) i internal (back-channel do keycloak:8080
  # oraz wolanie API przez api-gateway). Tokeny trzymane w sesji serwerowej.
  ssr-client:
    image: project-p-baglaj/ssr-client:${APP_VERSION:-dev}
    build:
      context: ../ssr-client
      dockerfile: Dockerfile
    environment:
      PORT: "4000"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_PUBLIC_URL: "http://localhost:${KEYCLOAK_PORT:-8090}"
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      SSR_CLIENT_ID: ${SSR_CLIENT_ID}
      SSR_CLIENT_SECRET: ${SSR_CLIENT_SECRET}
      SSR_SESSION_SECRET: ${SSR_SESSION_SECRET}
      SSR_API_BASE: "http://api-gateway/api"
      SSR_REDIRECT_URI: "http://localhost:4000/callback"
    ports:
      - "4000:4000"
    networks:
      - edge
      - internal
    depends_on:
      - keycloak
      - api-gateway
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Client nr 3: M2M analytics-worker (Client Credentials) ---
  # Tylko sieć internal (nie wystawiony na hosta). Cyklicznie agreguje analitykę z
  # mongo-service tokenem b2b-client (rola 'analytics').
  analytics-worker:
    image: project-p-baglaj/analytics-worker:${APP_VERSION:-dev}
    build:
      context: ./analytics-worker
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      B2B_CLIENT_ID: ${B2B_CLIENT_ID}
      B2B_CLIENT_SECRET: ${B2B_CLIENT_SECRET}
      MONGO_SERVICE_URL: "http://mongo-service:3002"
      ANALYTICS_POLL_INTERVAL_SECONDS: ${ANALYTICS_POLL_INTERVAL_SECONDS:-60}
    networks:
      - internal
    depends_on:
      - keycloak
      - mongo-service
    cpus: 0.25
    mem_limit: 128m
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8081:8080"
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo_password
      ME_CONFIG_BASICAUTH: "false"
    secrets:
      - mongo_password
    ports:
      - "8082:8081"
    networks:
      - edge
      - internal
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  mongodata:
  redisdata:
  keycloakdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
