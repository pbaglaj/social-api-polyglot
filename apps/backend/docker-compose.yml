services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    secrets:
      - mongo_password
    volumes:
      - mongodata:/data/db
    networks:
      - internal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Authorization Server (OAuth2 / OIDC) ---
  # Dedykowana baza Postgres tylko dla Keycloaka (oddzielona od bazy aplikacji).
  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: ${KC_DB_NAME}
    volumes:
      - keycloakdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d ${KC_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Keycloak = Authorization Server. Realm SocialPolyglot importowany przy starcie
  # z keycloak/realm-export.json (role Admin/User/Moderator/analytics + 3 klienci OAuth2).
  # Wystawiony na hosta (port 8090) dla przegladarki; w sieci internal dostepny jako keycloak:8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    networks:
      - edge
      - internal
    depends_on:
      keycloak-db:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1024m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pg-service:
    image: project-p-baglaj/pg-service:${APP_VERSION:-dev}
    build:
      context: ./pg-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PG_SERVICE_PORT}
      REDIS_URL: ${REDIS_URL}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS}
      # OAuth2 / walidacja JWT (Keycloak)
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      # Keycloak Admin REST API (zarzadzanie userami przez backend)
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const port=process.env.PORT||process.env.PG_SERVICE_PORT||3001; const req=http.get({host:'127.0.0.1', port: port, path:'/health', timeout:2000}, res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 5s
      timeout: 5s
      retries: 5
    # T9: Migracje (Prisma + Knex) i seedy z compose, odpalane przed startem aplikacji.
    # Kolejność: 1) Prisma migrate deploy, 2) Knex migrate latest, 3) Prisma seed, 4) Knex seed, 5) Start serwera.
    command: >
      sh -c "npx prisma migrate deploy
      && npx knex migrate:latest --knexfile knexfile.cjs
      && npx prisma db seed
      && npx knex seed:run --knexfile knexfile.cjs
      && npx tsx src/index.ts"
    cpus: 1.0
    mem_limit: 768m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo-service:
    image: project-p-baglaj/mongo-service:${APP_VERSION:-dev}
    build:
      context: ./mongo-service
      dockerfile: Dockerfile
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: ${MONGO_SERVICE_PORT}
      # OAuth2 / walidacja JWT (Keycloak)
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
    networks:
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
    # Seed feedu/rich-postow (paginacja kursorem) odpalany przed startem serwera.
    command: >
      sh -c "node dist/seed.js
      && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const port=process.env.PORT||process.env.MONGO_SERVICE_PORT||3002; const req=http.get({host:'127.0.0.1', port: port, path:'/health', timeout:2000}, res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 5s
      timeout: 5s
      retries: 5
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: nginx:alpine
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_GATEWAY_PORT}:80"
    networks:
      - edge
      - internal
    depends_on:
      pg-service:
        condition: service_healthy
      mongo-service:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8081:8080"
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo_password
      ME_CONFIG_BASICAUTH: "false"
    secrets:
      - mongo_password
    ports:
      - "8082:8081"
    networks:
      - edge
      - internal
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  mongodata:
  redisdata:
  keycloakdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
