events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS (zawsze 127.0.0.11). valid=10s odświeża IP backendów
    # po ich restarcie bez konieczności restartu samego nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Zmienne z nazwami serwisów — wymuszają dynamiczne rozwiązywanie DNS przez resolver.
        # Bez `set $var` nginx cache'uje IP na czas życia procesu.
        set $pg_upstream    "pg-service:3001";
        set $mongo_upstream "mongo-service:3002";

        # Standardowe nagłówki dla API Gateway
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS - pozwól zapytania z przeglądarki podczas developmentu
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, PATCH, DELETE" always;
        add_header Access-Control-Allow-Headers "Authorization,Origin,Accept,Content-Type,X-Requested-With" always;

        # Obsługa preflight (OPTIONS)
        if ($request_method = "OPTIONS") {
            return 204;
        }
        add_header Access-Control-Max-Age 1728000 always;

        # Health endpoints
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","upstreams":{"pg":"/health/pg","mongo":"/health/mongo"}}';
        }

        location /health/pg {
            rewrite ^/health/pg(.*)$ /health$1 break;
            proxy_pass http://$pg_upstream;
        }

        location /health/mongo {
            rewrite ^/health/mongo(.*)$ /health$1 break;
            proxy_pass http://$mongo_upstream;
        }

        # Endpointy - pg-service
        location /api/users {
            proxy_pass http://$pg_upstream;
        }

        location /api/posts {
            proxy_pass http://$pg_upstream;
        }

        # T1 (pg native), T2 (Knex.js), T3 (Sequelize v6)
        location /api/stats {
            proxy_pass http://$pg_upstream;
        }

        location /api/tags {
            proxy_pass http://$pg_upstream;
        }

        location /api/notifications {
            proxy_pass http://$pg_upstream;
        }

        # Endpointy - mongo-service
        location /api/feed {
            proxy_pass http://$mongo_upstream;
        }

        location /api/analytics {
            proxy_pass http://$mongo_upstream;
        }
    }
}
