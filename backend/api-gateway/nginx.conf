events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Standardowe nagłówki dla API Gateway
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Endpointy - pg-service
        location /api/users {
            proxy_pass http://pg-service:3001;
        }
        
        location /api/posts {
            proxy_pass http://pg-service:3001;
        }

        # Endpointy - mongo-service
        location /api/feed {
            proxy_pass http://mongo-service:3002;
        }

        location /api/analytics {
            proxy_pass http://mongo-service:3002;
        }
    }
}