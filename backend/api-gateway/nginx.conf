events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Standardowe nagłówki dla API Gateway
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS - pozwól zapytania z przeglądarki podczas developmentu
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, PATCH, DELETE" always;
        add_header Access-Control-Allow-Headers "Authorization,Origin,Accept,Content-Type,X-Requested-With" always;

        # Obsługa preflight (OPTIONS)
        if ($request_method = "OPTIONS") {
            return 204;
        }
        add_header Access-Control-Max-Age 1728000 always;

        # Endpointy - pg-service
        location /api/users {
            proxy_pass http://pg-service:3001;
        }

        location /api/posts {
            proxy_pass http://pg-service:3001;
        }

        # T1 (pg native), T2 (Knex.js), T3 (Sequelize v6)
        location /api/stats {
            proxy_pass http://pg-service:3001;
        }

        location /api/tags {
            proxy_pass http://pg-service:3001;
        }

        location /api/notifications {
            proxy_pass http://pg-service:3001;
        }

        # Endpointy - mongo-service
        location /api/feed {
            proxy_pass http://mongo-service:3002;
        }

        location /api/analytics {
            proxy_pass http://mongo-service:3002;
        }
    }
}