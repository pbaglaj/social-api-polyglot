services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  pg-service:
    build:
      context: ./pg-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PG_SERVICE_PORT}
    ports:
      - "${PG_SERVICE_PORT}:${PG_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const port=process.env.PORT||process.env.PG_SERVICE_PORT||3001; const req=http.get({host:'127.0.0.1', port: port, path:'/api/posts', timeout:2000}, res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 5s
      timeout: 5s
      retries: 5
    # T9: Migracje i seedy z compose, odpalane przed startem aplikacji
    # command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/index.js"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npx tsx src/index.ts"
  mongo-service:
    build:
      context: ./mongo-service
      dockerfile: Dockerfile
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: ${MONGO_SERVICE_PORT}
    ports:
      - "${MONGO_SERVICE_PORT}:${MONGO_SERVICE_PORT}"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); const port=process.env.PORT||process.env.MONGO_SERVICE_PORT||3002; const req=http.get({host:'127.0.0.1', port: port, path:'/api/analytics/trending', timeout:2000}, res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);\""]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    image: nginx:alpine
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_GATEWAY_PORT}:80"
    depends_on:
      pg-service:
        condition: service_healthy
      mongo-service:
        condition: service_healthy