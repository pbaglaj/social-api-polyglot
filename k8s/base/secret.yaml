apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  labels:
    app.kubernetes.io/part-of: social-api-polyglot
type: Opaque
# UWAGA: ponizsze wartosci to PLACEHOLDERY developerskie ("secret"), nie sekrety produkcyjne.
# W srodowisku prod nadpisz je przez:
#   kubectl -n social create secret generic db-credentials --from-literal=... --dry-run=client -o yaml | kubectl apply -f -
# lub przez sekrety CI (patrz .github/workflows/cd-k8s.yml). Nie commituj realnych hasel.
stringData:
  # --- PostgreSQL ---
  POSTGRES_PASSWORD: "secret"
  # Pelny URL z haslem (uzywany przez Prisma/Knex/Sequelize/pg)
  DATABASE_URL: "postgresql://postgres:secret@postgres:5432/social_db?schema=public"
  # --- MongoDB ---
  MONGO_INITDB_ROOT_USERNAME: "root"
  MONGO_INITDB_ROOT_PASSWORD: "secret"
  MONGO_URI: "mongodb://root:secret@mongodb:27017/social?authSource=admin"
