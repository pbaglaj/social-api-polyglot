apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: social-api-polyglot
spec:
  # ClusterIP — ruch zewnetrzny wchodzi wylacznie przez Ingress, nie bezposrednio.
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
