apiVersion: v1
kind: Service
metadata:
  name: pg-service
  labels:
    app: pg-service
    app.kubernetes.io/part-of: social-api-polyglot
spec:
  # ClusterIP — dostepny tylko wewnatrz klastra (ruch z api-gateway), brak ekspozycji na zewnatrz.
  selector:
    app: pg-service
  ports:
    - name: http
      port: 3001
      targetPort: http
