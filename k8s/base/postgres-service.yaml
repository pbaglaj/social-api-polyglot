apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: social-api-polyglot
spec:
  # Headless Service — stabilna tozsamosc sieciowa poda StatefulSet (postgres-0.postgres).
  # ClusterIP None => brak ekspozycji poza klaster (izolacja).
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
