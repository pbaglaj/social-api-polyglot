apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-seed
  labels:
    app: mongo-seed
    app.kubernetes.io/part-of: social-api-polyglot
  annotations:
    description: "Seed feedu/rich-postow (idempotentny). Re-run: kubectl delete job mongo-seed."
spec:
  backoffLimit: 5
  # 1h — logi seeda zostaja dostepne przez caly czas przegladu wg CHECKLIST.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: mongo-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Czekam na mongodb:27017..."
              until nc -z mongodb 27017; do sleep 2; done
              echo "MongoDB dostepny."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: seed
          image: mongo-service:dev
          workingDir: /app
          # Seed jest idempotentny (deleteMany przed insertMany) — bezpieczny przy ponownym uruchomieniu.
          command: ["node", "dist/seed.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MONGO_URI
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
