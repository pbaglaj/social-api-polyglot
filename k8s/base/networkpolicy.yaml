# NetworkPolicy — domyslnie blokujemy caly ruch przychodzacy w namespace,
# a nastepnie otwieramy tylko konkretne sciezki:
#   ingress-controller -> api-gateway
#   api-gateway        -> pg-service, mongo-service
#   pg-service         -> postgres, redis
#   mongo-service      -> mongodb
# Bazy/cache nie przyjmuja ruchu znikad poza swoimi konsumentami.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/part-of: social-api-polyglot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-ingress
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
  ingress:
    # Ruch od kontrolera ingress-nginx (inny namespace) oraz w obrebie klastra.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pg-service-from-gateway
spec:
  podSelector:
    matchLabels:
      app: pg-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongo-service-from-gateway
spec:
  podSelector:
    matchLabels:
      app: mongo-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 3002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-pg
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        # pg-service oraz Job migracji.
        - podSelector:
            matchLabels:
              app: pg-service
        - podSelector:
            matchLabels:
              app: pg-migrate
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-pg
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pg-service
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongodb-from-mongo
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        # mongo-service oraz Job seedujacy.
        - podSelector:
            matchLabels:
              app: mongo-service
        - podSelector:
            matchLabels:
              app: mongo-seed
      ports:
        - protocol: TCP
          port: 27017
